name: API CI

on:
  push:
    paths:
      - "api/**"
      - "docs/api-contract.md"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - "docs/api-contract.md"
      - ".github/workflows/api.yml"

# Read-only token: a compromised step cannot push code or edit releases.
permissions:
  contents: read

# A newer push to the same ref makes the older run useless: cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      # Actions are pinned by full commit SHA (tags can be moved); Dependabot bumps them.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes, so the token is not left in .git/config.
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers starts PostgreSQL on the runner's Docker. No repository secrets:
      # the tests generate their own keys.
      - name: Build and test
        run: ./mvnw -B verify
