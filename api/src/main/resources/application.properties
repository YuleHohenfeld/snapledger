spring.application.name=snapledger

# -----------------------------------------------------------------------------
# Configuration source
# No secret is ever written in this file. Every sensitive value is a ${VARIABLE}.
# - Production: variables come from the hosting environment.
# - Local dev:  variables come from the git-ignored `.env` at the repo root
#   (copy it from `.env.example`). Real environment variables take precedence.
# Both paths are optional so the API can be started from the repo root or from api/.
# PT: Origem da configuração. Nenhum segredo é escrito neste arquivo; todo valor sensível é uma
#     ${VARIAVEL}. Produção: as variáveis vêm do ambiente de hospedagem. Local: vêm do .env
#     (ignorado pelo git) na raiz do repo. Variáveis de ambiente reais têm prioridade. Os dois
#     caminhos são opcionais.
# -----------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database -----------------------------------------------------------------
# PT: --- Banco de dados ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:snapledger}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# pgjdbc copies the server's "Detail:" line into every SQLException message, and it quotes
# column values ("Key (email)=(ana@x.com) already exists"). Those messages reach loggers we do
# not control (Hibernate, Tomcat, Spring), so the driver must never build them. The constraint
# name stays in the primary message. Does NOT hide values PostgreSQL puts in the primary message
# itself (e.g. "invalid input syntax for type uuid"), which is why InternalErrors still masks.
# PT: O pgjdbc copia a linha "Detail:" do servidor na mensagem de toda SQLException, e ela cita
#     valores de colunas ("Key (email)=(ana@x.com) already exists"). Essas mensagens chegam a
#     loggers que não controlamos (Hibernate, Tomcat, Spring), então o driver nunca deve montá-las.
#     O nome da constraint continua na mensagem principal. NÃO esconde valores que o PostgreSQL
#     coloca na própria mensagem principal (por exemplo "invalid input syntax for type uuid"), por
#     isso o InternalErrors continua mascarando.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# Every connection waits at most 3 s for a lock, then fails (a masked 500, never a 401).
# A startup option, not SET: RESET ALL brings it back instead of removing it.
# PT: Toda conexão espera no máximo 3 s por um lock e depois falha (um 500 mascarado, nunca 401).
#     Uma opção de inicialização, não SET: o RESET ALL a traz de volta em vez de removê-la.
# Notes: docs/code-notes/security.md#lock_timeout
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=3s

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that entities match the tables and never creates or alters anything.
# PT: O Flyway é o dono do esquema. O Hibernate só confere se as entidades batem com as tabelas e
#     nunca cria nem altera nada.
spring.jpa.hibernate.ddl-auto=validate
# Do not keep the DB connection open while the HTTP response is rendered: avoids
# hidden lazy-loading queries (N+1) outside the service layer.
# PT: Não manter a conexão com o banco aberta enquanto a resposta HTTP é montada: evita consultas
#     preguiçosas escondidas (N+1) fora da camada de Service.
spring.jpa.open-in-view=false

# --- Errors -------------------------------------------------------------------
# Never leak internals to clients (these are the defaults, made explicit on purpose).
# PT: Nunca vazar detalhes internos para os clientes (estes já são os padrões, explícitos de
#     propósito).
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Security -----------------------------------------------------------------
# app.security.jwt.* is bound and validated by JwtProperties: the API refuses to start if
# JWT_SECRET is missing, not Base64 or shorter than 256 bits, or a TTL is not positive.
# app.security.refresh-token.ttl is bound and validated by RefreshTokenProperties (must be positive).
# PT: app.security.jwt.* é lido e validado pelo JwtProperties: a API não sobe se o JWT_SECRET
#     estiver ausente, não for Base64, tiver menos de 256 bits, ou se um TTL não for positivo.
#     app.security.refresh-token.ttl é lido e validado pelo RefreshTokenProperties (precisa ser
#     positivo).
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=snapledger-api
app.security.jwt.access-token-ttl=15m
app.security.refresh-token.ttl=30d

# app.account-code.* is bound and validated by AccountCodeProperties: the API refuses to start if
# ACCOUNT_CODE_SECRET is missing, not Base64 or shorter than 256 bits (ADR 0012).
# PT: app.account-code.* é lido e validado pelo AccountCodeProperties: a API não sobe se o
#     ACCOUNT_CODE_SECRET estiver ausente, não for Base64 ou tiver menos de 256 bits (ADR 0012).
app.account-code.secret=${ACCOUNT_CODE_SECRET:}
app.account-code.ttl=15m
app.account-code.max-attempts=5
app.account-code.resend-cooldown=60s
app.account-code.max-sends-per-hour=5
# Wrong guesses allowed per (user, purpose) per window, kept across new codes (ADR 0012).
# PT: Palpites errados permitidos por (usuário, finalidade) por janela, mantidos entre códigos novos (ADR 0012).
app.account-code.max-failures-per-day=10
app.account-code.failure-window=24h

# --- Email (ADR 0013) ---------------------------------------------------------
# Local default is Mailpit (docker compose). Short timeouts so a dead SMTP server cannot hold the
# mail thread for long. No mail.debug anywhere: SMTP debug output prints recipients and bodies.
# PT: O padrão local é o Mailpit (docker compose). Timeouts curtos para um SMTP morto não prender a
#     thread de email. Sem mail.debug em lugar nenhum: o debug do SMTP imprime destinatários e corpos.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# true/true for a real provider (login and TLS); Mailpit has no auth and no TLS, so the local default is false.
# PT: true/true para um provedor real (login e TLS); o Mailpit não tem login nem TLS, então o padrão local é false.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@snapledger.local}

# Explicit list of allowed browser origins. Never "*".
# PT: Lista explícita de origens de navegador permitidas. Nunca "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
