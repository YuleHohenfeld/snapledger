spring.application.name=snapledger

# -----------------------------------------------------------------------------
# Configuration source
# No secret is ever written in this file. Every sensitive value is a ${VARIABLE}.
# - Production: variables come from the hosting environment.
# - Local dev:  variables come from the git-ignored `.env` at the repo root
#   (copy it from `.env.example`). Real environment variables take precedence.
# Both paths are optional so the API can be started from the repo root or from api/.
# PT: Origem da configuração. Nenhum segredo é escrito neste arquivo; todo valor sensível é uma
#     ${VARIAVEL}. Produção: as variáveis vêm do ambiente de hospedagem. Local: vêm do .env
#     (ignorado pelo git) na raiz do repo. Variáveis de ambiente reais têm prioridade. Os dois
#     caminhos são opcionais.
# -----------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database -----------------------------------------------------------------
# PT: --- Banco de dados ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:snapledger}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# pgjdbc copies the server's "Detail:" line into every SQLException message, and it quotes
# column values ("Key (email)=(ana@x.com) already exists"). Those messages reach loggers we do
# not control (Hibernate, Tomcat, Spring), so the driver must never build them. The constraint
# name stays in the primary message. Does NOT hide values PostgreSQL puts in the primary message
# itself (e.g. "invalid input syntax for type uuid"), which is why InternalErrors still masks.
# PT: O pgjdbc copia a linha "Detail:" do servidor na mensagem de toda SQLException, e ela cita
#     valores de colunas ("Key (email)=(ana@x.com) already exists"). Essas mensagens chegam a
#     loggers que não controlamos (Hibernate, Tomcat, Spring), então o driver nunca deve montá-las.
#     O nome da constraint continua na mensagem principal. NÃO esconde valores que o PostgreSQL
#     coloca na própria mensagem principal (por exemplo "invalid input syntax for type uuid"), por
#     isso o InternalErrors continua mascarando.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that entities match the tables and never creates or alters anything.
# PT: O Flyway é o dono do esquema. O Hibernate só confere se as entidades batem com as tabelas e
#     nunca cria nem altera nada.
spring.jpa.hibernate.ddl-auto=validate
# Do not keep the DB connection open while the HTTP response is rendered: avoids
# hidden lazy-loading queries (N+1) outside the service layer.
# PT: Não manter a conexão com o banco aberta enquanto a resposta HTTP é montada: evita consultas
#     preguiçosas escondidas (N+1) fora da camada de Service.
spring.jpa.open-in-view=false

# --- Errors -------------------------------------------------------------------
# Never leak internals to clients (these are the defaults, made explicit on purpose).
# PT: Nunca vazar detalhes internos para os clientes (estes já são os padrões, explícitos de
#     propósito).
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Security -----------------------------------------------------------------
# app.security.jwt.* is bound and validated by JwtProperties: the API refuses to start if
# JWT_SECRET is missing, not Base64 or shorter than 256 bits, or a TTL is not positive.
# app.security.refresh-token.ttl is not read yet; RefreshTokenProperties binds and
# validates it in Increment 2.
# PT: app.security.jwt.* é lido e validado pelo JwtProperties: a API não sobe se o JWT_SECRET
#     estiver ausente, não for Base64, tiver menos de 256 bits, ou se um TTL não for positivo.
#     app.security.refresh-token.ttl ainda não é lido; o RefreshTokenProperties o valida
#     na entrega 2.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=snapledger-api
app.security.jwt.access-token-ttl=15m
app.security.refresh-token.ttl=30d

# Explicit list of allowed browser origins. Never "*".
# PT: Lista explícita de origens de navegador permitidas. Nunca "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
