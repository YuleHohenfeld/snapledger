spring.application.name=snapledger

# -----------------------------------------------------------------------------
# Configuration source
# No secret is ever written in this file. Every sensitive value is a ${VARIABLE}.
# - Production: variables come from the hosting environment.
# - Local dev:  variables come from the git-ignored `.env` at the repo root
#   (copy it from `.env.example`). Real environment variables take precedence.
# Both paths are optional so the API can be started from the repo root or from api/.
# -----------------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Database -----------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:snapledger}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration). Hibernate only checks
# that entities match the tables and never creates or alters anything.
spring.jpa.hibernate.ddl-auto=validate
# Do not keep the DB connection open while the HTTP response is rendered: avoids
# hidden lazy-loading queries (N+1) outside the service layer.
spring.jpa.open-in-view=false

# --- Errors -------------------------------------------------------------------
# Never leak internals to clients (these are the defaults, made explicit on purpose).
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Security -----------------------------------------------------------------
# app.security.jwt.* is bound and validated by JwtProperties: the API refuses to start if
# JWT_SECRET is missing, not Base64 or shorter than 256 bits, or a TTL is not positive.
# app.security.refresh-token.ttl is not read yet; RefreshTokenProperties binds and
# validates it in Increment 2.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=snapledger-api
app.security.jwt.access-token-ttl=15m
app.security.refresh-token.ttl=30d

# Explicit list of allowed browser origins. Never "*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
