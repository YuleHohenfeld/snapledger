# Static analysis for the SnapLedger app. `flutter analyze` must report zero issues
# (app/CLAUDE.md > Commands); the Stop hook runs it when app sources change.
# PT: Análise estática do app SnapLedger. O `flutter analyze` precisa reportar zero problemas
# PT: (app/CLAUDE.md > Commands); o hook Stop o executa quando o código do app muda.

include: package:flutter_lints/flutter.yaml

analyzer:
  # No implicit dynamic: JSON from the API must be cast explicitly, so a wrong shape fails loudly.
  # PT: Sem dynamic implícito: o JSON da API é convertido explicitamente, então um formato errado
  # PT: falha de forma visível.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/gen/**

linter:
  rules:
    # Imports: package imports only (hook rule D6), sorted.
    # PT: Imports: só imports de pacote (regra D6 do hook), ordenados.
    always_use_package_imports: true
    directives_ordering: true

    # Immutability by default.
    # PT: Imutabilidade por padrão.
    prefer_final_locals: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true

    # Async: every Future is awaited or explicitly unawaited; streams and sinks are closed.
    # PT: Async: todo Future é aguardado ou marcado como unawaited; streams e sinks são fechados.
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    use_build_context_synchronously: true

    # Types and safety.
    # PT: Tipos e segurança.
    avoid_dynamic_calls: true
    always_declare_return_types: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    avoid_print: true

    # Style that keeps diffs small.
    # PT: Estilo que mantém os diffs pequenos.
    prefer_single_quotes: true
    sort_child_properties_last: true
    sort_constructors_first: true
    unnecessary_lambdas: true
