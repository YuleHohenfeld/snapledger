name: snapledger
description: "SnapLedger: personal expense tracker (Flutter app)"
# Never published to pub.dev.
# PT: Nunca é publicado no pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

# A dependency is added only in the change that first uses it (app/CLAUDE.md > Stack).
# PT: Uma dependência só entra na mudança que a usa pela primeira vez (app/CLAUDE.md > Stack).
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
