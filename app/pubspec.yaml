name: snapledger
description: "SnapLedger: personal expense tracker (Flutter app)"
# Never published to pub.dev.
# PT: Nunca é publicado no pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

# A dependency is added only in the change that first uses it (app/CLAUDE.md > Stack).
# PT: Uma dependência só entra na mudança que a usa pela primeira vez (app/CLAUDE.md > Stack).
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
    sdk: flutter
  # `any` on purpose: flutter_localizations pins the exact intl version (see pubspec.lock).
  # PT: `any` de propósito: o flutter_localizations fixa a versão exata do intl (ver pubspec.lock).
  intl: any
  provider: ^6.1.5+1
  go_router: ^18.1.4
  decimal: ^3.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # `any` on purpose: flutter_test pins it; fakeAsync drives timers (e.g. the 5 s logout timeout).
  # PT: `any` de propósito: o flutter_test o fixa; o fakeAsync controla timers (ex.: o timeout de 5 s do logout).
  fake_async: any
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (settings in l10n.yaml).
  # PT: Gera o AppLocalizations a partir de lib/l10n/*.arb (configuração em l10n.yaml).
  generate: true
